name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Package extension (.vsix)
        run: npx @vscode/vsce package --no-git-tag-version --out o10dock.vsix

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v7
        with:
          name: o10dock-vsix
          path: o10dock.vsix
          retention-days: 14
