name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Compile
        run: npm run compile

      - name: Package extension (.vsix)
        run: npx @vscode/vsce package --no-git-tag-version --out o10dock.vsix

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v7
        with:
          name: o10dock-vsix
          path: o10dock.vsix
          retention-days: 14

  commitlint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ -z "$PR_TITLE" ]; then
            echo "::notice::No PR title to validate (manual run)."
            exit 0
          fi

          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if echo "$PR_TITLE" | grep -qE "$pattern"; then
            echo "PR title follows Conventional Commits: $PR_TITLE"
          else
            echo "::error::PR title must follow Conventional Commits, e.g. 'feat(dashboard): add project filter'."
            echo "::error::Got: $PR_TITLE"
            exit 1
          fi
